<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巨人的肩膀</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1c1c1a; --ink-2:#5c5c57; --ink-3:#9a9a93;
  --line:#e8e8e3; --soft:#f1f1ed; --accent:#d9622b; --accent-soft:#fbeee6;
  --green:#2f8f5b; --green-soft:#e6f4ec; --amber:#b7791f; --amber-soft:#fbf3e2;
  --blue:#2f6fbf; --blue-soft:#e8f0fa; --gray-soft:#efefeb; --red:#c2453b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --panel:#1c1c1b; --ink:#ededea; --ink-2:#a8a8a2; --ink-3:#6d6d68;
  --line:#2c2c2a; --soft:#232322; --accent:#ec7a45; --accent-soft:#33241c;
  --green:#5cc08a; --green-soft:#1c2b22; --amber:#e0a84a; --amber-soft:#2e2718;
  --blue:#6aa2e8; --blue-soft:#1b2533; --gray-soft:#262624; --red:#e57368; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1c1c1b; --ink:#ededea; --ink-2:#a8a8a2; --ink-3:#6d6d68;
  --line:#2c2c2a; --soft:#232322; --accent:#ec7a45; --accent-soft:#33241c;
  --green:#5cc08a; --green-soft:#1c2b22; --amber:#e0a84a; --amber-soft:#2e2718;
  --blue:#6aa2e8; --blue-soft:#1b2533; --gray-soft:#262624; --red:#e57368; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:36px 20px 80px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.02em}
.brand h1 span{color:var(--ink-3);font-weight:400;font-size:15px;margin-left:8px;letter-spacing:0}
.brand p{margin:4px 0 0;color:var(--ink-2)}
.status{display:flex;gap:18px;color:var(--ink-2);font-size:13px;flex-wrap:wrap;align-items:center}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;
  box-shadow:0 0 0 3px var(--green-soft);vertical-align:1px}
.dot.off{background:var(--ink-3);box-shadow:none}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:11px}
.tabs button{border:0;background:transparent;color:var(--ink-2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tabs button span{color:var(--ink-3);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;min-width:200px;outline:0}
.search:focus{border-color:var(--ink-3)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.meta{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px;margin-bottom:8px;flex-wrap:wrap}
.src{font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--gray-soft);color:var(--ink-2)}
.src.claude{background:var(--accent-soft);color:var(--accent)}
.src.codex{background:var(--blue-soft);color:var(--blue)}
.meta .jump{margin-left:auto;color:var(--ink-3)}
.meta .jump:hover{color:var(--accent)}
h2{margin:0;font-size:18px;font-weight:620;letter-spacing:-.01em}
.quote{color:var(--ink-2);margin-top:4px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.verdict{display:flex;gap:10px;align-items:baseline;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--soft);flex-wrap:wrap}
.pill{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.v-use{background:var(--green-soft);color:var(--green)}
.v-adapt{background:var(--blue-soft);color:var(--blue)}
.v-reference{background:var(--amber-soft);color:var(--amber)}
.v-build{background:var(--gray-soft);color:var(--ink-2)}
.sat{flex:none;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.sat.crowded{border-color:var(--amber);color:var(--amber)}
.sat.saturated{border-color:var(--red);color:var(--red)}
.tips{color:var(--ink-2);font-size:13px;margin:8px 2px 0}
.err{color:var(--red);font-size:13px;margin-top:10px}
.running{margin-top:12px;color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:8px}
.running i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}
.comp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:0}
.comp b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.comp b i{flex:none;width:8px;height:8px;border-radius:50%}
.comp.covered b i{background:var(--green)}
.comp.partial b i{background:var(--amber)}
.comp.gap{border-style:dashed}
.comp.gap b i{background:transparent;border:1.5px solid var(--ink-3)}
.comp .by{color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaps{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.gaps b{color:var(--accent);font-weight:600}
.gaps ul{margin:4px 0 0;padding-left:18px;color:var(--ink)}
.projbox{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:13px}
.projbox b{color:var(--blue);font-weight:600}
.projbox ul{margin:4px 0 0;padding-left:18px}
.localbox{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
.localbox>b{color:var(--ink)}

.list{margin-top:14px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div{min-width:0}
.fit{position:relative;width:44px;height:44px}
.fit svg{transform:rotate(-90deg)}
.fit span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name a{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--ink-2);font-weight:500}
.tag.mode-direct{background:var(--green-soft);color:var(--green)}
.tag.mode-fork{background:var(--blue-soft);color:var(--blue)}
.tag.mode-reference{background:var(--amber-soft);color:var(--amber)}
.tag.part{background:var(--accent-soft);color:var(--accent)}
.tag.read{background:var(--green-soft);color:var(--green)}
.flag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--amber-soft);color:var(--amber)}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.stale{color:var(--amber)}
.what{color:var(--ink);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.desc{color:var(--ink-2);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.what+.desc{color:var(--ink-3);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.kv dd.risk{color:var(--amber)}
.code{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-family:var(--mono);font-size:12px;background:var(--soft);border-radius:7px;padding:3px 4px 3px 9px;color:var(--ink)}
.code code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code button{flex:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:5px}
.code button:hover{background:var(--panel);color:var(--ink)}
.codebox{margin-top:10px;border:1px solid var(--line);border-radius:12px;font-size:13px;overflow:hidden}
.codebox>summary{cursor:pointer;padding:8px 12px;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.codebox>summary::-webkit-details-marker{display:none}
.codebox>summary b{font-weight:600}
.dir{font-size:11px;padding:1px 7px;border-radius:5px}
.dir.upgrade{background:var(--green-soft);color:var(--green)}.dir.confirm{background:var(--blue-soft);color:var(--blue)}
.dir.downgrade{background:var(--amber-soft);color:var(--amber)}
.codebox .in{padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.codebox .in p{margin:0}
.codebox h4{margin:0 0 3px;font-size:12px;color:var(--ink-2);font-weight:600}
.codebox ul,.codebox ol{margin:0;padding-left:18px}
.codebox li{margin:2px 0}
a.path{font-family:var(--mono);font-size:12px;color:var(--blue)}
a.path:hover{text-decoration:underline}
.cst{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}
.cst.implemented{background:var(--green)}.cst.partial{background:var(--amber)}
.more{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;padding:10px 0 0}
.more:hover{color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.kws{display:flex;gap:5px;flex-wrap:wrap}
.kws span{background:var(--soft);padding:1px 8px;border-radius:5px;font-family:var(--mono);font-size:11.5px}
.caveat{color:var(--ink-3);font-size:12px;margin-top:6px}
.empty{text-align:center;color:var(--ink-3);padding:70px 20px}
.empty div{font-size:40px;margin-bottom:8px}
.empty code{background:var(--soft);padding:2px 8px;border-radius:6px;font-family:var(--mono);color:var(--ink)}

/* 折叠卡片 */
.fold{padding:0;overflow:hidden}
.fhead{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;cursor:pointer}
.fhead:hover{background:var(--soft)}
.fmain{flex:1;min-width:0}
.chev{flex:none;font-size:22px;line-height:1;color:var(--ink-3);transition:transform .15s;margin-top:20px}
.fold.open .chev{transform:rotate(90deg)}
.fbody{padding:4px 22px 20px;border-top:1px solid var(--line)}
.goal{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.said{margin-top:12px;color:var(--ink-3);font-size:12.5px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2)}
.rline.muted{color:var(--ink-3)}
.rline .count b{color:var(--ink)}
.rep-n{color:var(--ink-3);font-size:12px;margin-left:4px}
.mini{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--ink-2)}
.mini b{color:var(--ink);font-weight:600;margin-left:2px}
.tr{margin-top:8px}
.tr .rline{margin-top:3px}
.trt{font-size:13px;font-weight:600;color:var(--ink)}
.task.misc{opacity:.7}
.rep{padding-top:14px}
.rep+.rep{border-top:1px dashed var(--line);margin-top:16px}
.rep h3{margin:0;font-size:16px;font-weight:620}
#full{margin:0 0 14px}
.hint{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--ink-2)}
.slist2{list-style:none;margin:0;padding:0}
.slist2 li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.slist2 li:last-child{border-bottom:0}
.slist2 .st{flex:1;min-width:160px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist2 .sm{color:var(--ink-3);font-size:12px}
.slist2 a{color:var(--ink-3);font-size:12px}
.slist2 a:hover{color:var(--accent)}

/* 会话视图 */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.slist{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
  position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.sitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;
  padding:11px 14px;cursor:pointer}
.sitem:last-child{border-bottom:0}
.sitem:hover{background:var(--soft)}
.sitem.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.sitem .t{font-weight:580;font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sitem .m{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--bg)}
.badge.v-use{background:var(--green);color:var(--bg)}.badge.v-adapt{background:var(--blue);color:var(--bg)}
.badge.v-reference{background:var(--amber);color:var(--bg)}
.shead h2{font-size:20px}
.sinfo{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;margin-top:6px}
.sinfo b{color:var(--ink-2);font-weight:500}
.prompts{margin:16px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}
.prompts li{position:relative;padding:6px 0 10px 16px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.prompts li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.prompts li.hit{color:var(--ink)}
.prompts li.hit::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prompts li .when{display:block;color:var(--ink-3);font-size:11.5px;margin-bottom:2px}
.prompts li .clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.section-t{margin:22px 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 深挖 */
.pill.v-deep{background:var(--accent-soft);color:var(--accent)}
.deepbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.deepbar p{margin:0;flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:550}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.dsum{font-size:14px;color:var(--ink);margin:4px 0 10px}
.dsame{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.dfirst{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13.5px;margin-bottom:16px}
.dfirst b{color:var(--accent)}
.dprob{margin:18px 0 6px}
.dprob h4{margin:0;font-size:15px;font-weight:620}
.dprob .ang{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.pick{padding:11px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick .pn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick .pn a{font-weight:600}
.pick .pm{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.pick .pw{font-size:13px;color:var(--ink);margin-top:3px}
.pick .pb{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;font-size:13px;color:var(--ink-2);margin-top:4px}
.pick .pb span:nth-child(odd){color:var(--ink-3)}
.tag{font-size:11px;padding:0 6px;border-radius:5px;background:var(--amber-soft);color:var(--amber)}
.dskip{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.dlic{margin-top:14px;font-size:12.5px;color:var(--ink-2);padding:10px 12px;background:var(--soft);border-radius:10px}
.dfoot{margin-top:10px;font-size:12px;color:var(--ink-3)}

.deepbar.qpanel{display:block}
.deepbar.qpanel p{flex:none;min-width:0}
.qbody{flex:1;min-width:240px}.qbody p{margin:0 0 8px}
.qbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.qroot{display:block;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.qroot input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
.qcost b{color:var(--ink)}
.warn{color:var(--amber)}
.dph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dph h4{flex:1;min-width:200px}
.dprob.faded h4{color:var(--ink-3);text-decoration:line-through}
.ns{font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;background:var(--blue-soft);color:var(--blue)}
.ns.new{background:var(--accent-soft);color:var(--accent)}
.todo{display:flex;gap:2px;align-items:center;background:var(--soft);padding:2px;border-radius:9px}
.todo button{border:0;background:transparent;color:var(--ink-3);font-size:12px;padding:3px 8px;border-radius:7px;cursor:pointer}
.todo button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.btn.sm{padding:3px 10px;font-size:12px;margin-left:6px}
.todo .btn.sm{padding:3px 10px;margin-left:4px;font-size:12px;color:var(--bg)}
.dcode{margin:8px 0;padding:10px 12px;border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 10px 10px 0;font-size:13px;color:var(--ink-2)}
.dcode b{color:var(--ink);font-size:12px}
.dcode p{margin:4px 0}
.dcode ul{margin:4px 0;padding-left:18px}
.dcode code{font-family:var(--mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.chk{display:flex;gap:8px;margin-top:6px}
.chk i{font-style:normal;font-weight:700;width:16px;text-align:center}
.chk.confirmed i{color:var(--green)}.chk.refuted i{color:var(--red)}.chk.unclear i{color:var(--amber)}
.chk small{color:var(--ink-3);overflow-wrap:anywhere}
.dfix{margin:8px 0;font-size:13px;color:var(--ink-2)}
.dfix b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.dinc{font-size:12.5px;color:var(--blue);margin-bottom:8px}
.dres{padding:10px 14px;border-radius:12px;background:var(--green-soft);font-size:13px;margin-bottom:12px}
.dres ul{margin:4px 0 0;padding-left:18px}
.dprog{font-size:12px;color:var(--ink-3);margin:-6px 0 4px}
dialog.set.wide{width:min(760px,calc(100vw - 32px))}
.set textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 11px;font:12.5px/1.55 var(--mono);outline:0;resize:vertical}

/* 任务卡片分层 */
.layer{padding:18px 0 4px}
.layer+.layer{border-top:1px solid var(--line);margin-top:14px}
.lh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lh h3{margin:0;font-size:14px;font-weight:650;letter-spacing:.02em}
.lh .li{font-size:15px}
.lh .lm{margin-left:auto;font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.clamp1,.clamp2,.clamp3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{-webkit-line-clamp:1}.clamp2{-webkit-line-clamp:2}.clamp3{-webkit-line-clamp:3}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .chev{transform:rotate(90deg)}
.chev.sm{font-size:16px}

/* 深挖结果 */
.deep{display:flex;flex-direction:column;gap:12px}
.dstats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dstats span{font-size:12px;color:var(--ink-2);background:var(--soft);padding:3px 10px;border-radius:999px}
.dstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.dstats .ok{background:var(--green-soft);color:var(--green)}
.dstats .inc{background:var(--blue-soft);color:var(--blue)}
.dstats .sub{background:transparent;color:var(--ink-3);margin-left:auto;padding-right:0}
.dsumm>summary{display:flex;gap:10px;align-items:flex-end;font-size:14px;color:var(--ink);line-height:1.6}
.dsumm>summary em{font-style:normal;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dsumm[open]>summary{display:none}
.dsumm p{margin:0 0 8px;font-size:14px;line-height:1.65}
.dsumm p b{display:inline-block;font-size:12px;color:var(--ink-3);margin-right:8px;font-weight:600}
.dfirst2{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px;min-width:0}
.dfirst2 .lbl{font-weight:700;color:var(--accent);white-space:nowrap}
.dfirst2 a{font-weight:600;white-space:nowrap}
.dfirst2 .why{color:var(--ink-2);flex:1;min-width:0}
.mfit{display:inline-block;margin-left:5px;font-size:11px;font-weight:700;padding:0 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.mfit.hi{background:var(--green-soft);color:var(--green)}.mfit.mid{background:var(--blue-soft);color:var(--blue)}.mfit.lo{background:var(--amber-soft);color:var(--amber)}
.plist{display:flex;flex-direction:column;gap:8px}
.prob{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.prob>summary{display:flex;align-items:center;gap:12px;padding:12px 14px}
.prob>summary:hover{background:var(--soft)}
.prob[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.prob.faded .ptitle{color:var(--ink-3);text-decoration:line-through}
.pnum{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.prob.faded .pnum{background:var(--ink-3)}
.pt{flex:1;min-width:0}
.ptitle{font-size:14px;font-weight:600;line-height:1.45}
.pmini{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.prob .todo{flex:none}
.todo .go{border:0;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 10px;border-radius:7px;cursor:pointer;margin-left:4px;font-weight:600}
.pbody{padding:4px 16px 14px}
.pang{font-size:12.5px;color:var(--ink-3);padding:10px 0 2px}
.blk{padding:12px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border-bottom:0}
.bt{font-size:12px;font-weight:650;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.bt span{font-weight:400;letter-spacing:0}
.blk p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.more{margin-top:6px}
.more>summary{font-size:12.5px;color:var(--ink-3);padding:2px 0}
.more>summary::before{content:"▸ ";}
.more[open]>summary::before{content:"▾ ";}
.more>summary:hover{color:var(--accent)}
.more>*:not(summary){margin-top:8px}
.more p{font-size:13px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.more.ok>summary{color:var(--green);font-weight:600}
.more ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.files{list-style:none;padding:0!important}
.files li{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.files li:last-child{border-bottom:0}
.files code{font-family:var(--mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.files span{color:var(--ink-3);font-size:12.5px}
.pick2{border-bottom:1px solid var(--line)}
.pick2:last-child{border-bottom:0}
.pick2>summary{display:flex;gap:12px;align-items:center;padding:9px 0}
.pick2>summary:hover .pn a{color:var(--accent)}
.pk{flex:1;min-width:0}
.pk .pn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pk .pn a{font-weight:600;font-size:13.5px}
.pk .pw{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pk .pm{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pb2{display:grid;grid-template-columns:56px 1fr;gap:6px 10px;margin:0 0 12px 56px;font-size:13px;line-height:1.6}
.pb2 dt{color:var(--ink-3);font-size:12px;padding-top:1px}
.pb2 dd{margin:0;color:var(--ink)}
.scan{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.scan>summary{display:flex;align-items:center;gap:12px;padding:12px 14px}
.scan>summary:hover{background:var(--soft)}
.scan[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.st2{flex:1;min-width:0}
.st2 .rline{margin-top:6px}
.scanbody{padding:4px 16px 14px}
@media (max-width:640px){
  .prob>summary{flex-wrap:wrap}
  .prob .todo{order:3;width:100%;justify-content:flex-start}
  .pb2{margin-left:0}
  .dstats .sub{margin-left:0}
}

.blk:has(> details.more[open]) > p.clamp3:has(+ details.more[open]){display:none}

.others{border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px}
.others .more{margin:0 0 8px}
.plt{margin:6px 0 -4px}

.chwarn{padding:9px 13px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:13px}
.chwarn.blind{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.triz p{margin:0 0 4px}
.triz .ideal{color:var(--ink-2);font-size:13px}
.fields{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.fields li{font-size:13px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--accent-soft)}
.fields li b{color:var(--ink);margin-right:8px;font-weight:600}
.qlog{margin-top:10px}
.qlog table{width:100%;border-collapse:collapse;font-size:12px}
.qlog td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.qlog td:first-child{white-space:nowrap;color:var(--ink-3);width:36px}
.qlog td code{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.qlog td.n{text-align:right;font-variant-numeric:tabular-nums;width:44px}
.qlog tr.bad td{color:var(--red)}

/* 模型下拉 */
.combo{position:relative}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;max-height:260px;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px}
.combo-list .opt{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:7px;cursor:pointer;font:12.5px/1.4 var(--mono);color:var(--ink)}
.combo-list .opt small{font-family:inherit;color:var(--ink-3);font-size:11px}
.combo-list .opt:hover,.combo-list .opt.on{background:var(--soft)}
.combo-list .opt.cur{color:var(--accent)}
.combo-list .none,.combo-list .cnt{padding:5px 9px;font-size:11.5px;color:var(--ink-3)}
.combo-list .cnt{border-top:1px solid var(--line);margin-top:4px}

/* 设置 */
dialog.set{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.set::backdrop{background:rgba(0,0,0,.35)}
.set .sh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.set .sh h3{margin:0;font-size:16px}
.set .sb{padding:16px 20px;max-height:70vh;overflow-y:auto}
.set .sf{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.set .sf .msg{flex:1;font-size:12.5px;color:var(--ink-2);min-width:160px}
.set label.f{display:block;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin:14px 0 6px}
.set label.f:first-child{margin-top:0}
.set input[type=text],.set input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;outline:0}
.set input:focus{border-color:var(--ink-3)}
.set .note{font-size:12px;color:var(--ink-3);margin-top:5px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}
.modes label small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

.modes label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

@media (max-width:640px){.modes{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}}

@media (max-width:820px){

}

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>🔭 巨人的肩膀<span>Shoulders of Giants</span></h1>
      <p>动手之前，先站到别人已经造好的东西上，看得更远。</p>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="chips" id="tools"></div>
  </div>

  <div class="hint" id="full" hidden></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<dialog class="set" id="settings"></dialog>
<dialog class="set wide" id="todo"></dialog>

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
function localGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function localSet(k, v) { try { localStorage.setItem(k, v) } catch {} }

const AGENT = {claude: "Claude", codex: "Codex", manual: "手动", deep: "深挖", cursor: "Cursor", gemini: "Gemini", copilot: "Copilot"};
const VERDICT = {use: "直接用", adapt: "改着用", reference: "借鉴", build: "自己造"};
const SAT = {open: "空白", crowded: "拥挤", saturated: "饱和"};
const MODE = {direct: "直接用", fork: "fork 改", reference: "借鉴思路"};
const KIND = {product: "在线产品", "open-source": "开源", package: "包", extension: "扩展", "hf-space": "HF Space", plugin: "插件", article: "文章", other: "网页"};
const SRC = {github: "GitHub", hackernews: "Hacker News", npm: "npm", crates: "crates.io", homebrew: "Homebrew", vscode: "VS Code", arxiv: "arXiv", huggingface: "Hugging Face", web: "网页"};
const STAGE = {queued: "排队中", gate: "判断意图", keywords: "拆需求、想关键词", searching: "搜索 GitHub · 包仓库 · 全网", judging: "按部件核验", deepdive: "克隆候选仓库、读代码核实",
  context: "读这个任务的会话和文档", recall: "找出卡点、点名候选（强模型 + 全网）", verify: "GitHub 核实 + 补搜", judge: "挑选、写怎么借鉴"};
const REUSE = {install: "直接装", import: "当库引用", copy: "拷几个文件", fork: "fork 改", reference: "只借鉴"};
const EFFORT = {low: "工作量小", medium: "工作量中", high: "工作量大"};
const DIR = {upgrade: "代码比 README 更好", confirm: "和 README 一致", downgrade: "代码不如 README 说的"};

const state = {
  tab: localGet("radar.tab") === "reports" ? "reports" : "tasks",
  onlyRadar: false,
  verdict: "all",
  q: "",
  open: new Set(),
  deep: {},     // 任务 id → 正在跑的深挖 {id, status}
  plan: {},     // 任务 id → 深挖报价
  models: {list: [], note: "", active: -1},   // 设置里的模型下拉
};

function ago(t) {
  const s = Date.now() / 1000 - t;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}
const isoTs = iso => iso ? Date.parse(iso) / 1000 : 0;
const kfmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : n;
const base = p => (p || "").split("/").filter(Boolean).pop() || "";
const agentTag = a => `<span class="src ${esc(a)}">${esc(AGENT[a] || a)}</span>`;

function ring(fit) {
  const c = fit >= 80 ? "var(--green)" : fit >= 50 ? "var(--blue)" : "var(--amber)";
  const r = 19, L = 2 * Math.PI * r;
  return `<div class="fit"><svg width="44" height="44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>
    <circle cx="22" cy="22" r="${r}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${L * fit / 100} ${L}"/></svg><span>${fit}</span></div>`;
}
function cmd(text) {
  if (!text) return "";
  if (/^[^\x00-\x7F]/.test(text)) return esc(text);
  return `<span class="code"><code title="${esc(text)}">${esc(text)}</code><button data-copy="${esc(text)}">复制</button></span>`;
}
function pathLink(x, p) {
  if (x.source !== "github") return `<code>${esc(p)}</code>`;
  const url = `https://github.com/${x.name}/blob/HEAD/${p.split("/").map(encodeURIComponent).join("/")}`;
  return `<a class="path" href="${safeUrl(url)}" target="_blank" rel="noopener">${esc(p)}</a>`;
}
function pop(x) {
  if (x.popularity == null) return "";
  return x.pop_label === "★" ? `★ ${kfmt(x.popularity)}` : `${kfmt(x.popularity)} ${esc(x.pop_label || "")}`;
}

/* 第一版报告没有 matches，换算成同一种结构 */
function matchesOf(d) {
  if (d.matches) return d.matches;
  const out = [];
  for (const x of d.repos || []) out.push({id: "github:" + x.repo, source: "github", name: x.repo, url: x.url, desc: x.desc,
    popularity: x.stars, pop_label: "★", fit: x.fit, what: x.what, coverage: "whole", use_mode: x.use_mode, how_to_use: x.how_to_use,
    scenario: x.scenario, risk: x.risk, license: x.license, lang: x.lang, updated: x.updated});
  for (const [i, x] of (d.web || []).entries()) out.push({id: "web:" + i, source: "web", name: x.name, url: x.url, desc: x.note,
    kind: x.kind, fit: x.fit, what: x.what, coverage: "whole", use_mode: "reference", how_to_use: x.how_to_use, scenario: x.scenario});
  return out.sort((a, b) => b.fit - a.fit);
}

function codeBlock(x, rid) {
  const c = x.code;
  if (!c) return "";
  if (!c.ok) return `<details class="codebox"><summary>🔍 代码侦察没成功</summary><div class="in"><p>${esc(c.error)}</p></div></details>`;
  const r = c.reuse || {}, q = c.quality || {};
  const key = `${rid}:${x.id}`;
  const delta = x.fit_readme != null && x.fit_readme !== x.fit ? ` · README 估 ${x.fit_readme}% → 代码 ${x.fit}%` : "";
  const entries = (c.entry_points || []).map(e => `<li>${pathLink(x, e.path)} — ${esc(e.role)}</li>`).join("");
  const comps = (c.components || []).map(k => `<li style="list-style:none;margin-left:-18px"><span class="cst ${esc(k.status)}"></span><b>${esc(k.component)}</b>：${esc(k.how)}
    ${(k.files || []).length ? `<br><span style="margin-left:14px">${k.files.map(f => pathLink(x, f)).join(" · ")}</span>` : ""}</li>`).join("");
  const steps = (r.steps || []).map(s => `<li>${cmd(s)}</li>`).join("");
  const qual = [q.tests ? "有测试" : "没测试", q.size, (q.deps || []).length && "依赖 " + q.deps.slice(0, 6).join(", ")].filter(Boolean).map(esc).join(" · ");
  const flags = (c.red_flags || []).map(f => `<li>${esc(f)}</li>`).join("");
  return `<details class="codebox" data-k="${esc(key)}"${state.open.has(key) ? " open" : ""}><summary>🔍 <b>读过代码</b><span class="dir ${esc(c.verdict)}">${DIR[c.verdict] || ""}</span>
      <span class="tag">${REUSE[r.mode] || ""} · ${EFFORT[r.effort] || ""}</span>${flags ? '<span class="flag">⚠ 有代码隐患</span>' : ""}
      <span style="color:var(--ink-3);font-size:12px">${c.turns || 0} 步 · ${c.secs || 0}s${delta}</span></summary>
    <div class="in"><p>${esc(c.summary)}</p>
      ${entries ? `<div><h4>入口 / 核心文件</h4><ul>${entries}</ul></div>` : ""}
      ${comps ? `<div><h4>部件核实</h4><ul>${comps}</ul></div>` : ""}
      ${r.mode ? `<div><h4>怎么复用 — ${esc(r.effort_reason || "")}</h4><ol>${steps}</ol></div>` : ""}
      ${qual ? `<div><h4>代码质量</h4><p>${qual}${q.notes ? " — " + esc(q.notes) : ""}</p></div>` : ""}
      ${flags ? `<div><h4>⚠ 代码隐患</h4><ul>${flags}</ul></div>` : ""}</div></details>`;
}

function matchRow(x, rid) {
  const label = x.source === "web" ? (KIND[x.kind] || "网页") : (SRC[x.source] || x.source);
  const cover = x.coverage === "part" ? `<span class="tag part">部件 · ${esc(x.component)}</span>` : "";
  const read = x.code && x.code.ok ? `<span class="tag read">读过代码</span>` : "";
  const sub = [pop(x), x.lang && esc(x.lang), x.license && esc(x.license === "none" ? "无 License" : x.license),
    x.updated && `<span class="${x.stale ? "stale" : ""}">${x.stale ? "⚑ " : ""}更新 ${esc(x.updated)}</span>`]
    .filter(Boolean).map(v => `<span>${v}</span>`).join("");
  const risk = [x.risk, ...(x.flags || [])].filter(v => v && v !== "无").join("；");
  return `<div class="row">${ring(x.fit)}<div>
    <div class="name"><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>
      <span class="tag">${esc(label)}</span>${cover}<span class="tag mode-${esc(x.use_mode)}">${MODE[x.use_mode] || ""}</span>${read}</div>
    ${x.what ? `<div class="what">${esc(x.what)}</div>` : ""}
    ${x.desc ? `<div class="desc" title="${esc(x.desc)}">${esc(x.desc)}</div>` : ""}
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    <dl class="kv">${x.scenario ? `<dt>场景</dt><dd>${esc(x.scenario)}</dd>` : ""}
      ${x.missing && x.missing !== "无" ? `<dt>缺少</dt><dd>${esc(x.missing)}</dd>` : ""}
      ${risk ? `<dt>注意</dt><dd class="risk">${esc(risk)}</dd>` : ""}
      ${x.how_to_use ? `<dt>怎么用</dt><dd>${cmd(x.how_to_use)}</dd>` : ""}</dl>
    ${codeBlock(x, rid)}</div></div>`;
}

function reportTitle(r) { const d = r.data || {}; return d.title || r.summary || r.message.slice(0, 40); }

/* 收起时的一行：结论 + 找到几个 + 前几名 */
function radarLine(r) {
  const d = r.data || {};
  if (r.status === "error") return `<div class="rline"><span class="pill v-build">出错</span><span>${esc(r.error)}</span></div>`;
  if (r.status !== "done") return `<div class="rline"><span class="running"><i></i>${STAGE[r.status] || r.status}…</span></div>`;
  if (d.kind === "deep") {
    const first = (d.first || {}).repo;
    return `<div class="rline"><span class="pill v-deep">深挖</span><span class="count"><b>${(d.problems || []).length}</b> 个卡点，<b>${d.picks || 0}</b> 个可借鉴的项目${first ? ` · 先看 <b>${esc(first.split("/").pop())}</b>` : ""}${r.repeats ? `<span class="rep-n">（深挖过 ${r.repeats.length + 1} 次，显示最新一次）</span>` : ""}</span></div>`;
  }
  const all = matchesOf(d);
  const read = all.filter(x => x.code && x.code.ok).length;
  const top = all.slice(0, 3).map(x => `<span class="mini">${esc(x.name.split("/").pop())} <b>${x.fit}</b></span>`).join("");
  return `<div class="rline"><span class="pill v-${esc(r.verdict)}">${VERDICT[r.verdict] || ""}</span>
    <span class="count">找到 <b>${all.length}</b> 个现成实现${read ? `，读过 <b>${read}</b> 个的代码` : ""}${r.repeats ? `<span class="rep-n">（查过 ${r.repeats.length + 1} 次，显示最新一次）</span>` : ""}</span>${top}</div>`;
}

/* 展开后：别人怎么实现的 */
const TODO = {todo: "待办", doing: "在做", done: "完成", skip: "不做"};
const CHECK = {confirmed: ["✔", "已确认"], refuted: ["✘", "已否定"], unclear: ["?", "待确认"]};

function det(key, cls, summary, body) {
  return `<details class="${cls}" data-k="${esc(key)}"${state.open.has(key) ? " open" : ""}><summary>${summary}</summary>${body}</details>`;
}
const miniRing = fit => fit == null ? "" : `<span class="mfit ${fit >= 80 ? "hi" : fit >= 60 ? "mid" : "lo"}">${fit}</span>`;

/* 搜索通道：对照搜索 + 每条查询的记录 */
function channelWarn(d) {
  const sl = d.search_log;
  if (!sl || sl.status === "ok") return "";
  const bad = (sl.queries || []).filter(q => q.error);
  const rl = bad.filter(q => q.error.kind === "rate_limit").length;
  return sl.status === "blind"
    ? `<div class="chwarn blind">⚠ GitHub 搜索没通过对照搜索（连 torvalds/linux 都没搜到）${(sl.canary || {}).error ? `：${esc(sl.canary.error.kind === "rate_limit" ? "被限流" : sl.canary.error.message)}` : ""}。这次搜不到的不代表没有，"没有同款"无法判断，建议稍后重跑。</div>`
    : `<div class="chwarn">⚠ ${bad.length} 条查询失败${rl ? `（${rl} 条被限流，重跑即可）` : "（不是限流，需要排查）"}，结果可能有遗漏。</div>`;
}
function queryLog(d) {
  const sl = d.search_log;
  if (!sl) return "";
  const rows = [sl.canary, ...(sl.queries || [])].filter(Boolean);
  const st = {ok: "正常", degraded: "部分失败", blind: "对照没通过"}[sl.status] || sl.status;
  return `<div class="qlog"><div class="bt">搜索记录<span>通道${st} · ${rows.length} 条，0 条结果也照实记</span></div>
    <table>${rows.map(q => `<tr class="${q.error ? "bad" : ""}"><td>${q.source === "canary" ? "对照" : q.source === "github_api" ? "核实" : "搜索"}</td>
      <td><code>${esc(q.query)}</code></td><td class="n">${q.error ? (q.error.kind === "rate_limit" ? "限流" : "出错") : q.n}</td></tr>`).join("")}</table></div>`;
}

function deepBody(r) {
  const d = r.data || {};
  if (r.status === "error") return `<div class="err">深挖出错：${esc(r.error)}</div>`;
  if (r.status !== "done") return `<div class="rline"><span class="running"><i></i>${STAGE[r.status] || r.status}…</span></div>`;
  const todo = d.todo || {};
  const probs = d.problems || [];
  const done = probs.filter((_, i) => ["done", "skip"].includes(todo[i])).length;
  const k = s => `d${r.id}-${s}`;

  const pick = (x, i, j, helps) => {
    const meta = [x.stars != null ? "★" + kfmt(x.stars) : "", x.license, x.updated ? x.updated.slice(0, 7) : ""].filter(Boolean).map(esc).join(" · ");
    return det(k(`x${i}-${j}`), "pick2", `
        ${x.fit != null ? ring(x.fit) : `<div class="fit"></div>`}
        <div class="pk"><div class="pn"><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.repo)}</a>
          ${x.archived ? `<span class="tag">已归档</span>` : ""}${x.verified === false ? `<span class="tag">未核实</span>` : ""}</div>
          <div class="pw">${esc(x.what || x.desc || "")}</div><div class="pm">${meta}${helps ? ` · 帮到卡点 ${helps}` : ""}</div></div>
        <span class="chev sm">›</span>`,
      `<dl class="pb2"><dt>借什么</dt><dd>${esc(x.borrow)}</dd><dt>用在哪</dt><dd>${esc(x.where)}</dd></dl>`);
  };

  const codeBlk = c => {
    if (!c) return "";
    const n = v => (c.checks || []).filter(x => x.verdict === v).length;
    const sum = [n("confirmed") && `✔ ${n("confirmed")} 条确认`, n("refuted") && `✘ ${n("refuted")} 条否定`, n("unclear") && `? ${n("unclear")} 条待定`].filter(Boolean).join(" · ");
    return `<div class="blk"><div class="bt">代码里看到的${sum ? `<span>${sum}</span>` : ""}</div>
      ${c.facts ? `<p class="clamp3">${esc(c.facts)}</p>` : ""}
      ${det(k("c" + c.problem), "more", `展开：${(c.files || []).length} 个相关文件、${(c.checks || []).length} 条猜测核实`,
        `${(c.files || []).length ? `<ul class="files">${c.files.map(f => `<li><code>${esc(f.path)}</code><span>${esc(f.what)}</span></li>`).join("")}</ul>` : ""}
         ${(c.checks || []).map(x => `<div class="chk ${esc(x.verdict)}"><i>${CHECK[x.verdict][0]}</i><span><b>${esc(x.hypothesis)}</b><br><small>${esc(x.proof)}</small></span></div>`).join("")}`)}</div>`;
  };

  const prob = (p, i) => {
    const st = todo[i] || "todo";
    const tops = (p.picks || []).slice(0, 3).map(x => `<span class="mini">${esc(x.repo.split("/").pop())}${miniRing(x.fit)}</span>`).join("");
    return det(k("p" + i), `prob ${st === "done" || st === "skip" ? "faded" : ""}`, `
        <span class="pnum">${i + 1}</span>
        <div class="pt"><div class="ptitle">${d.incremental ? `<span class="ns ${esc(p.status)}">${p.status === "ongoing" ? "还在" : "新"}</span>` : ""}${esc(p.problem)}</div>
          <div class="pmini">${tops || `<span class="muted">没挑到参考</span>`}</div></div>
        ${DATA.server ? `<div class="todo">${Object.entries(TODO).map(([kk, l]) => `<button class="${st === kk ? "on" : ""}" data-todo="${r.id}:${i}:${kk}">${l}</button>`).join("")}
          <button class="go" data-go="${r.id}:${i}">去做 →</button></div>` : ""}
        <span class="chev">›</span>`,
      `<div class="pbody">
        ${p.contradiction ? `<div class="blk triz"><div class="bt">卡在哪个矛盾<span>TRIZ</span></div><p>${esc(p.contradiction)}</p>
          ${p.ideal ? `<p class="ideal">理想结果：${esc(p.ideal)}</p>` : ""}
          ${(p.fields || []).length ? `<ul class="fields">${p.fields.map(x => `<li><b>${esc(x.field)}</b>${esc(x.how)}</li>`).join("")}</ul>` : ""}</div>`
          : p.angle ? `<div class="pang">找参考的方向：${esc(p.angle)}</div>` : ""}
        ${p.fix ? `<div class="blk"><div class="bt">怎么改</div><p class="clamp3">${esc(p.fix)}</p>
          ${p.fix.length > 140 ? det(k("f" + i), "more", "展开全文", `<p>${esc(p.fix)}</p>`) : ""}</div>` : ""}
        ${codeBlk(p.code ? {...p.code, problem: i} : null)}
        <div class="blk"><div class="bt">参考项目<span>${(p.picks || []).length} 个 · 按契合度排序</span></div>
          ${(p.picks || []).map((x, j) => pick(x, i, j)).join("") || `<p class="muted">没挑到靠谱的参考项目。</p>`}</div>
        ${p.skip ? det(k("s" + i), "more", "暂不需要的方向", `<p>${esc(p.skip)}</p>`) : ""}
      </div>`);
  };

  // 别人是怎么做的：所有卡点的参考项目去重，按契合度排
  const byRepo = new Map();
  probs.forEach((p, i) => (p.picks || []).forEach(x => {
    const cur = byRepo.get(x.repo);
    if (!cur) byRepo.set(x.repo, {x, at: [i]});
    else { cur.at.push(i); if ((x.fit || 0) > (cur.x.fit || 0)) cur.x = x; }
  }));
  const others = [...byRepo.values()].sort((a, b) => (b.x.fit || 0) - (a.x.fit || 0));
  const otherRow = (o, n) => pick(o.x, "all", n, o.at.map(i => i + 1).join("、"));
  const othersBlk = others.length ? `<div class="others"><div class="bt">别人是怎么做的<span>${others.length} 个项目 · 按契合度排序 · 点开看借什么、用在哪</span></div>
      ${others.slice(0, 5).map(otherRow).join("")}
      ${others.length > 5 ? det(k("oth"), "more", `展开其余 ${others.length - 5} 个`, others.slice(5).map((o, n) => otherRow(o, n + 5)).join("")) : ""}</div>` : "";

  const f = d.first || {};
  const firstPick = probs.flatMap(p => p.picks || []).find(x => x.repo === f.repo);
  const c = d.checked || {};
  return `<div class="deep">
    <div class="dstats">
      <span><b>${probs.length}</b> 个卡点</span><span><b>${d.picks || 0}</b> 个参考</span>
      ${(d.resolved || []).length ? `<span class="ok"><b>${d.resolved.length}</b> 个已解决</span>` : ""}
      ${DATA.server && probs.length ? `<span>待办 <b>${done}/${probs.length}</b></span>` : ""}
      ${d.incremental ? `<span class="inc">增量 · ${d.prompts || 0} 句新话</span>` : ""}
      <span class="sub">${ago(r.created)} · $${(r.cost || 0).toFixed(2)}</span>
    </div>
    ${channelWarn(d)}
    ${det(k("sum"), "dsumm", `<span class="clamp2">${esc(d.summary_text)}</span><em>展开</em>`,
      `<p>${esc(d.summary_text)}</p>${d.project ? `<p><b>项目</b>${esc(d.project)}</p>` : ""}${d.same_kind ? `<p><b>同款</b>${esc(d.same_kind)}</p>` : ""}`)}
    ${f.repo ? `<div class="dfirst2"><span class="lbl">先看</span><a href="${safeUrl((firstPick || {}).url)}" target="_blank" rel="noopener">${esc(f.repo)}</a>${miniRing((firstPick || {}).fit)}
      <span class="why clamp1">${esc(f.reason)}</span></div>` : ""}
    ${(d.resolved || []).length ? det(k("res"), "more ok", `✅ 已解决 ${d.resolved.length} 个`, `<ul>${d.resolved.map(x => `<li><b>${esc(x.problem)}</b> — ${esc(x.how)}</li>`).join("")}</ul>`) : ""}
    ${othersBlk}
    <div class="bt plt">卡点<span>点开看怎么改、代码里看到的、对应的参考项目</span></div>
    <div class="plist">${probs.map(prob).join("")}</div>
    ${det(k("meta"), "more", "许可证、来源和搜索记录", `${d.license_note ? `<p>${esc(d.license_note)}</p>` : ""}${queryLog(d)}
      <p class="muted">读了 ${d.sessions || 0} 个会话里的 ${d.prompts || 0} 句话 · ${d.root ? `代码目录 <code>${esc(d.root)}</code>${d.code && d.code.error ? `（读代码失败：${esc(d.code.error)}）` : ""}` : "没读代码"}
      · 点名 ${c.named || 0} 个，确认存在 ${c.exist || 0} 个${(c.missing || []).length ? `，剔除查无此仓库：${esc(c.missing.join("、"))}` : ""}${c.carried ? ` · 沿用上次 ${c.carried} 个` : ""} · 补搜 ${c.searched || 0} 个
      · ${esc((d.models || {}).deep || "")}${d.budget ? ` · 上限 $${Number(d.budget).toFixed(2)}` : ""}</p>`)}
  </div>`;
}

function reportBody(r) {
  const d = r.data || {};
  if (d.kind === "deep") return deepBody(r);
  if (r.status !== "done") return r.status === "error" ? `<div class="err">出错：${esc(r.error)}</div>` : "";
  const all = matchesOf(d);
  const expanded = state.open.has("m" + r.id);
  const shown = expanded ? all : all.slice(0, 4);
  const names = Object.fromEntries(all.map(x => [x.id, x.name]));
  const comps = (d.components || []).length ? `<div class="comps">${d.components.map(c => {
    const by = (c.by || []).map(id => names[id] || id.replace(/^\w+:/, "")).slice(0, 3).join("、");
    const st = {covered: "已有现成", partial: "部分覆盖", gap: "空白"}[c.status] || "";
    return `<div class="comp ${esc(c.status)}" title="${esc(c.note)}"><b><i></i>${esc(c.name)}</b><div class="by">${st}${by ? " · " + esc(by) : ""}</div></div>`;
  }).join("")}</div>` : "";
  const gaps = (d.gaps || []).length ? `<div class="gaps"><b>你可以填补的空白</b><ul>${d.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : "";
  const p = d.project;
  const proj = p && p.ok ? `<div class="projbox"><b>🧭 你的项目 · ${esc(base(p.cwd))}</b> ${esc(p.summary)}<ul>
    ${(p.existing || []).map(x => `<li>已有 <code>${esc(x.path)}</code> — ${esc(x.what)}</li>`).join("")}
    ${(p.integration || []).map(x => `<li>接入点 <code>${esc(x.path)}</code> — ${esc(x.why)}</li>`).join("")}</ul>
    ${p.notes ? `<div style="margin-top:4px">${esc(p.notes)}</div>` : ""}</div>` : "";
  const searched = Object.entries(d.sources || {}).filter(([, v]) => v.ok).map(([k]) => SRC[k] || k).join("、");
  const more = all.length > 4 ? `<button class="more" data-toggle="m${r.id}">${expanded ? "收起" : `展开全部 ${all.length} 个`}</button>` : "";
  return `<div class="verdict"><span class="pill v-${esc(r.verdict)}">${VERDICT[r.verdict] || ""}</span>
      ${d.saturation ? `<span class="sat ${esc(d.saturation)}">${SAT[d.saturation]}</span>` : ""}<span>${esc(d.verdict_text)}</span></div>
    ${channelWarn(d)}${comps}${gaps}${d.tips ? `<div class="tips">💡 ${esc(d.tips)}</div>` : ""}${proj}
    ${shown.length ? `<div class="section-t">别人是怎么做的</div><div class="list">${shown.map(x => matchRow(x, r.id)).join("")}</div>` : ""}${more}
    <div class="foot"><div class="kws">${(d.keywords || []).map(x => `<span>${esc(x)}</span>`).join("")}</div>
      <div>${searched ? "已搜索：" + esc(searched) + " · " : ""}$${(r.cost || 0).toFixed(3)} · ${ago(r.created)}</div></div>
    ${d.search_log ? det("q" + r.id, "more", "GitHub 搜索记录", queryLog(d)) : ""}
    ${d.caveat ? `<div class="caveat">${esc(d.caveat)}</div>` : ""}`;
}

/* 雷达报告页的单张卡片：收起只看任务和结论，点开看全部 */
function card(r) {
  const d = r.data || {};
  const key = "c" + r.id, isOpen = state.open.has(key);
  return `<article class="card fold ${isOpen ? "open" : ""}">
    <div class="fhead" data-toggle="${key}">
      <div class="fmain"><div class="meta">${[r.source, ...(r.also_in || [])].map(agentTag).join("")}
        ${r.cwd ? `<span>${esc(base(r.cwd))}</span><span>·</span>` : ""}<span>${ago(r.msg_ts || r.created)}</span></div>
        <h2>${esc(reportTitle(r))}</h2>
        <p class="goal">${esc(d.goal || r.summary || r.message)}</p>
        ${radarLine(r)}</div>
      <span class="chev" aria-hidden="true">›</span></div>
    ${isOpen ? `<div class="fbody">${r.message !== (d.goal || "") && d.kind !== "deep" ? `<div class="said">你的原话：${esc(r.message)}</div>` : ""}${reportBody(r)}</div>` : ""}
  </article>`;
}

function sessionTitle(s) {
  const first = (s.prompts || [])[0];
  for (const t of [s.display_name, s.first_message, first && first.text]) {
    const line = String(t || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    if (line && !String(t).trim().startsWith("<")) return line.slice(0, 120);
  }
  return (first && first.text.replace(/<[^>]+>/g, " ").trim().slice(0, 120)) || s.id;
}

/* 任务卡片：一组相似的会话 */
function taskCard(t) {
  const key = "t" + t.id, isOpen = state.open.has(key);
  const sessions = t.sessions.map(id => DATA.sessionById[id]).filter(Boolean);
  const reports = t.reports.map(id => DATA.reportById[id]).filter(Boolean);
  const agents = [...new Set([...sessions.map(s => s.agent), ...reports.map(r => r.source)])];
  const ordered = [...reports.filter(r => (r.data || {}).kind === "deep").slice(0, 1), ...reports.filter(r => (r.data || {}).kind !== "deep")];
  const lines = ordered.length ? ordered.slice(0, 3).map(r => `<div class="tr"><span class="trt">${esc(reportTitle(r))}</span>${radarLine(r)}</div>`).join("")
    : `<div class="rline muted">还没查过有没有现成的</div>`;
  let body = "";
  if (isOpen) {
    const deeps = reports.filter(r => (r.data || {}).kind === "deep");
    const scans = reports.filter(r => (r.data || {}).kind !== "deep");
    const latestDeep = deeps.find(r => r.status === "done") || deeps[0];
    const rep = scans.map(r => det("r" + r.id, "scan", `<div class="st2"><div class="ptitle">${esc(reportTitle(r))}</div>${radarLine(r)}</div><span class="chev">›</span>`,
        `<div class="scanbody">${(r.data || {}).goal ? `<p class="goal">${esc(r.data.goal)}</p>` : ""}${reportBody(r)}</div>`)).join("");
    const sess = sessions.map(s => {
      const link = DATA.agentsviewUrl ? `<a href="${safeUrl(DATA.agentsviewUrl + "/sessions/" + encodeURIComponent(s.id))}" target="_blank" rel="noopener">打开 →</a>` : "";
      return `<li>${agentTag(s.agent)}<span class="st">${esc(sessionTitle(s))}</span><span class="sm">${esc(s.project || "")} · ${ago(isoTs(s.ended_at || s.started_at))} · ${s.user_message_count || 0} 条</span>${link}</li>`;
    }).join("");
    const running = state.deep[t.id], pl = state.plan[t.id];
    let deepBar = "";
    if (t.id === "misc") deepBar = "";
    else if (!DATA.server) deepBar = `<div class="deepbar"><p>🔎 想深挖这个任务？用 ${cmd("giants page")} 打开完整版再点"深挖"，或运行 ${cmd(`giants deep ${t.id}`)}</p></div>`;
    else if (running) deepBar = `<div class="deepbar"><p><span class="running"><i></i>深挖中：${esc(STAGE[running.status] || "开始")}…</span></p><button class="btn" disabled>进行中…</button></div>`;
    else if (pl === "loading") deepBar = `<div class="deepbar"><p>估算中…</p></div>`;
    else if (pl && pl.error) deepBar = `<div class="deepbar"><p>估算失败：${esc(pl.error)}</p><button class="btn" data-plan="${esc(t.id)}">重试</button></div>`;
    else if (pl) {
      const none = pl.incremental && !pl.new_prompts;
      deepBar = `<div class="deepbar qpanel"><div class="qbody">
          <p>${pl.incremental ? `🔁 <b>增量深挖</b>：上次是 ${ago(pl.prev_when)}，之后有 <b>${pl.new_prompts}</b> 句新话；会对照上次的卡点标出已解决 / 还在 / 新出现。`
            : `🔎 <b>深挖</b>：读 ${pl.sessions} 个会话里你说的 ${pl.prompts} 句话（取最近约 ${Math.round(pl.chars / 1000)} 千字）。`}</p>
          ${none ? `<p class="warn">上次之后没有新会话，增量深挖不会有新东西。</p>` : ""}
          <label class="qroot">项目目录（代码 agent 会读这里的源码核实卡点）<input type="text" id="root-${esc(t.id)}" value="${esc(pl.root)}" placeholder="留空 = 不读代码"></label>
          <p class="qcost">预计 <b>$${pl.est_low.toFixed(2)}–${pl.est_high.toFixed(2)}</b> · 上限 $${pl.budget.toFixed(2)}（⚙ 设置里改）· ${esc(pl.model)} 想 + ${esc(pl.code_model)} 读代码${DATA.server ? "" : ""}</p></div>
        <div class="qbtn">${none ? "" : `<button class="btn primary" data-deepgo="${esc(t.id)}">开始</button>`}
          ${pl.incremental ? `<button class="btn" data-deepgo="${esc(t.id)}" data-full="1">全量重挖</button>` : ""}
          <button class="btn" data-plancancel="${esc(t.id)}">取消</button></div></div>`;
    } else deepBar = `<div class="deepbar"><p>🔎 <b>深挖</b>：读这个任务里你说过的话和项目源码，找出现在卡在哪，按问题去找能借鉴的项目，GitHub 逐个核实。先报价再开始。</p>
        <button class="btn primary" data-plan="${esc(t.id)}">深挖</button></div>`;
    const hint = !reports.length ? `<div class="hint">想知道别人怎么做的？在 Claude Code 里说"查一下${esc(t.name)}有没有现成的"，或运行 ${cmd(`radar scan "${t.name}"`)}</div>` : "";
    const layer = (icon, title, meta, inner) => `<section class="layer"><div class="lh"><span class="li">${icon}</span><h3>${title}</h3>${meta ? `<span class="lm">${meta}</span>` : ""}</div>${inner}</section>`;
    body = `<div class="fbody">
      ${t.id === "misc" ? "" : layer("🔎", "深挖", latestDeep && latestDeep.repeats ? `深挖过 ${latestDeep.repeats.length + 1} 次，显示最新一次` : "", deepBar + (latestDeep ? deepBody(latestDeep) : ""))}
      ${layer("📦", "查过的需求 · 别人是怎么做的", scans.length ? scans.length + " 个" : "", rep || hint || `<p class="muted">还没有。</p>`)}
      ${sess ? layer("💬", "相关会话", sessions.length + " 个", det("s" + t.id, "more", `展开会话列表`, `<ul class="slist2">${sess}</ul>`)) : ""}
    </div>`;
  }
  return `<article class="card fold task ${isOpen ? "open" : ""} ${t.id === "misc" ? "misc" : ""}">
    <div class="fhead" data-toggle="${key}">
      <div class="fmain"><div class="meta">${agents.map(agentTag).join("")}
        <span>${sessions.length ? sessions.length + " 个会话" : "手动查询"}</span><span>·</span><span>${ago(t.last)}</span></div>
        <h2>${esc(t.name)}</h2>
        <p class="goal">${esc(t.summary)}</p>
        ${lines}</div>
      <span class="chev" aria-hidden="true">›</span></div>
    ${body}</article>`;
}

function renderStatus() {

}

function renderTabs() {
  const tabs = [["tasks", "任务", DATA.tasks.filter(t => t.id !== "misc").length], ["reports", "查询报告", DATA.reports.length]];
  $("#tabs").innerHTML = tabs.map(([k, l, c]) => `<button class="${state.tab === k ? "on" : ""}" data-tab="${k}">${l}<span>${c}</span></button>`).join("");
  let tools = `<input class="search" id="q" placeholder="搜索…" value="${esc(state.q)}">`;
  if (state.tab === "reports") {
    const count = v => DATA.reports.filter(r => v === "all" || r.verdict === v).length;
    tools += [["all", "全部"], ["use", "直接用"], ["adapt", "改着用"], ["reference", "借鉴"], ["build", "自己造"]]
      .map(([v, l]) => `<button class="chip ${state.verdict === v ? "on" : ""}" data-verdict="${v}">${l} ${count(v)}</button>`).join("");
  } else {
    tools += `<button class="chip ${state.onlyRadar ? "on" : ""}" data-only="1">只看查过的</button>`;
  }
  $("#tools").innerHTML = tools;
}

function matchQ(...texts) {
  const q = state.q.trim().toLowerCase();
  return !q || texts.some(t => String(t || "").toLowerCase().includes(q));
}

function renderReports() {
  const rows = DATA.reports.filter(r => (state.verdict === "all" || r.verdict === state.verdict)
    && matchQ(reportTitle(r), r.message, (r.data || {}).goal, (r.data || {}).verdict_text));
  $("#main").innerHTML = rows.length ? rows.map(card).join("")
    : `<div class="empty"><div>🔭</div>还没有查询报告。<br>在 Claude Code 里说"帮我做一个…"，或者运行 <code>radar scan "想法"</code></div>`;
}

function renderTasks() {
  if (!DATA.tasks.length) {
    $("#main").innerHTML = DATA.agentsview
      ? `<div class="empty"><div>🗂</div>还没有归类的任务。运行 <code>radar page</code> 重新生成。</div>`
      : `<div class="empty"><div>🔌</div>AgentsView 没在运行，读不到会话。<br>启动：<code>cd ~/Projects/agentsview && ./agentsview serve</code>，再运行 <code>radar page</code>。</div>`;
    return;
  }
  const rows = DATA.tasks.filter(t => (!state.onlyRadar || t.reports.length) && matchQ(t.name, t.summary,
    ...t.sessions.map(id => DATA.sessionById[id]).filter(Boolean).map(sessionTitle),
    ...t.reports.map(id => DATA.reportById[id]).filter(Boolean).map(reportTitle)));
  $("#main").innerHTML = rows.length ? rows.map(taskCard).join("") : `<div class="empty">没有匹配的任务</div>`;
}

function render() {
  renderTabs();
  state.tab === "reports" ? renderReports() : renderTasks();
}

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1400); }

document.addEventListener("click", e => {
  if (e.target.closest("a,.codebox,.code button")) { if (!e.target.closest("[data-copy]")) return; }
  const t = e.target.closest("[data-copy],[data-plan],[data-deepgo],[data-plancancel],[data-todo],[data-go],[data-todoact],[data-toggle],[data-tab],[data-verdict],[data-only],#theme,#openset,[data-set]");
  if (!t) return;
  if (t.id === "openset") {
    openSettings();
  } else if (t.dataset.set) {
    settingsAction(t.dataset.set);
  } else if (t.dataset.plan) {
    loadPlan(t.dataset.plan);
  } else if (t.dataset.deepgo) {
    const gid = t.dataset.deepgo, root = (document.getElementById("root-" + gid) || {}).value;
    delete state.plan[gid]; startDeep(gid, !!t.dataset.full, root);
  } else if (t.dataset.plancancel) {
    delete state.plan[t.dataset.plancancel]; render();
  } else if (t.dataset.todo) {
    e.preventDefault();
    const [rid, idx, st] = t.dataset.todo.split(":"); setTodo(+rid, +idx, st);
  } else if (t.dataset.go) {
    e.preventDefault();
    const [rid, idx] = t.dataset.go.split(":"); openTodo(+rid, +idx);
  } else if (t.dataset.todoact) {
    todoAction(t.dataset.todoact);
  } else if (t.id === "theme") {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    localSet("radar.theme", document.documentElement.dataset.theme);
  } else if (t.dataset.copy) {
    navigator.clipboard.writeText(t.dataset.copy).then(() => toast("已复制"));
  } else if (t.dataset.toggle) {
    state.open.has(t.dataset.toggle) ? state.open.delete(t.dataset.toggle) : state.open.add(t.dataset.toggle); render();
  } else if (t.dataset.tab) {
    state.tab = t.dataset.tab; state.q = ""; localSet("radar.tab", state.tab); render();
  } else if (t.dataset.verdict) {
    state.verdict = t.dataset.verdict; render();
  } else if (t.dataset.only) {
    state.onlyRadar = !state.onlyRadar; render();
  }
});
document.addEventListener("toggle", e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k) e.target.open ? state.open.add(k) : state.open.delete(k);
}, true);
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  state.q = e.target.value;
  state.tab === "reports" ? renderReports() : renderTasks();
});

/* ---------- 本机服务：设置和深挖 ---------- */
async function api(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET", body: body ? JSON.stringify(body) : undefined,
    headers: {"X-Radar-Token": DATA.server.token, "Content-Type": "application/json"}});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

const MODEL_HINTS = ["haiku", "sonnet", "opus", "claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-1"];
const MODE_TXT = {auto: ["自动", "先用 Claude 订阅，额度用完自动换 API key"], subscription: ["只用订阅", "Claude Max / Pro 额度"], api: ["只用 API", "按量付费，可配 Base URL"]};

async function openSettings() {
  const dlg = $("#settings");
  if (!DATA.server) {
    dlg.innerHTML = `<div class="sh"><h3>设置</h3><button class="theme" data-set="close">关闭</button></div>

      <p class="note">命令行也可以：${cmd("radar auth --set-key")} ${cmd("radar auth --mode api")}</p></div>`;
    return dlg.showModal();

/* 模型列表：别名 + 从 Base URL（或官方）拉到的 */
async function fetchModels(force) {
  if (state.models.list.length && !force) return;
  const note = t => { state.models.note = t; const el = document.querySelector("#s-models"); if (el) el.textContent = t; };
  note("正在拉取模型列表…");
  try {
    const {models, base_url} = await api("/api/models");
    state.models.list = models;
    note(`从 ${base_url ? base_url.replace(/^https?:\/\//, "") : "Anthropic 官方"} 拉到 ${models.length} 个模型`);
  } catch (e) { note("没拉到模型列表：" + e.message); }
}

function comboOptions(q) {
  const all = [...MODEL_HINTS.map(m => ({m, alias: true})), ...state.models.list.filter(m => !MODEL_HINTS.includes(m)).map(m => ({m}))];
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return all.filter(x => words.every(w => x.m.toLowerCase().includes(w)));
}

function showCombo(input, filter) {
  const list = input.nextElementSibling;
  const opts = comboOptions(filter ? input.value : "");
  list.innerHTML = (opts.length ? opts.map((x, i) => `<div class="opt ${x.m === input.value ? "cur" : ""}" data-pick="${esc(x.m)}">${esc(x.m)}${x.alias ? `<small>别名</small>` : ""}</div>`).join("")
    : `<div class="none">没有匹配的模型，直接用你输入的「${esc(input.value)}」</div>`)
    + `<div class="cnt">${state.models.list.length ? `共 ${state.models.list.length} 个模型，打字搜索` : "只有别名；填好 API key 后会拉取完整列表"}</div>`;
  list.hidden = false;
  state.models.active = -1;
}

document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.stage) showCombo(e.target, false); });
document.addEventListener("focusout", e => {
  if (e.target.dataset && e.target.dataset.stage) setTimeout(() => { e.target.nextElementSibling.hidden = true; }, 150);
});
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.stage) showCombo(e.target, true); });
document.addEventListener("mousedown", e => {
  const o = e.target.closest("[data-pick]");
  if (!o) return;
  e.preventDefault();
  const input = o.closest(".combo").querySelector("input");
  input.value = o.dataset.pick; input.nextElementSibling.hidden = true;
});
document.addEventListener("keydown", e => {
  const input = e.target;
  if (!input.dataset || !input.dataset.stage) return;
  const list = input.nextElementSibling, opts = [...list.querySelectorAll("[data-pick]")];
  if (list.hidden || !opts.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    state.models.active = (state.models.active + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.classList.toggle("on", i === state.models.active));
    opts[state.models.active].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && state.models.active >= 0) {
    e.preventDefault(); input.value = opts[state.models.active].dataset.pick; list.hidden = true;
  } else if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); list.hidden = true; }
});

      <label class="f">模型</label>
      <div class="mgrid">${Object.entries(s.stages).map(([k, v]) => `<span>${esc(v.label)}<small>${k} · 默认 ${esc(v.default)}</small></span>
        <div class="combo"><input type="text" data-stage="${k}" value="${esc(s.models[k])}" placeholder="${esc(v.default)}" autocomplete="off" spellcheck="false">
          <div class="combo-list" hidden></div></div>`).join("")}</div>
      <div class="note">点输入框会弹出模型列表，打字就能搜；也可以直接填任意模型 ID。
        <button class="btn sm" data-set="models">重新拉取模型列表</button></div>
      <div class="note" id="s-models">${state.models.note || ""}</div>
    </div>
    <div class="sf"><span class="msg" id="s-msg">${s.api_cost ? `API 实际花费累计 $${s.api_cost.toFixed(2)}` : ""}${s.fallback_min ? ` · 订阅刚撞限，${s.fallback_min} 分钟内走 API` : ""}</span>
      <button class="btn" data-set="test">保存并测试</button><button class="btn primary" data-set="save">保存</button></div>`;
}

function collectSettings() {
  const dlg = $("#settings");
  const body = {mode: (dlg.querySelector("input[name=mode]:checked") || {}).value,
    base_url: dlg.querySelector("#s-base").value, deep_budget: dlg.querySelector("#s-budget").value, models: {}};
  const key = dlg.querySelector("#s-key").value.trim();
  if (key) body.api_key = key;
  dlg.querySelectorAll("[data-stage]").forEach(i => { body.models[i.dataset.stage] = i.value.trim(); });
  return body;
}

async function settingsAction(what) {
  const dlg = $("#settings");
  if (what === "close") return dlg.close();
  const msg = t => { const el = dlg.querySelector("#s-msg"); if (el) el.textContent = t; };
  try {
    if (what === "models") {
      await api("/api/settings", collectSettings());
      await fetchModels(true);
      return msg("已拉取模型列表");
    }
    if (what === "clearkey") { renderSettings(await api("/api/settings", {clear_key: true})); return msg("已删除 API key"); }
    const s = await api("/api/settings", collectSettings());
    renderSettings(s);
    if (what === "save") { msg("已保存"); return; }
    msg("测试中…（用「判断意图」那一档模型调一次）");
    const t = await api("/api/test", {stage: "gate"});
    msg(`测试通过：${t.model} · ${t.mode === "subscription" ? "订阅" : t.mode === "api" ? "API" : "自动"} · $${t.cost.toFixed(4)}`);
  } catch (e) { msg("失败：" + e.message); }
}

async function loadPlan(gid) {
  state.plan[gid] = "loading"; render();
  try { state.plan[gid] = await api("/api/deep/plan?task=" + encodeURIComponent(gid)); }
  catch (e) { state.plan[gid] = {error: e.message}; }
  render();
}

async function setTodo(rid, idx, status) {
  try {
    const {todo} = await api("/api/todo", {id: rid, idx, status});
    DATA.reportById[rid].data.todo = todo; render();
  } catch (e) { toast("没改成：" + e.message); }
}

let todoCur = null;
async function openTodo(rid, idx) {
  const dlg = $("#todo");
  todoCur = {rid, idx};
  const p = DATA.reportById[rid].data.problems[idx];
  dlg.innerHTML = `<div class="sh"><h3>去做：${esc(p.problem)}</h3><button class="theme" data-todoact="close">关闭</button></div><div class="sb">读取中…</div>`;
  dlg.showModal();
  try {
    const t = await api(`/api/todo/prompt?id=${rid}&idx=${idx}`);
    dlg.innerHTML = `<div class="sh"><h3>去做：${esc(p.problem)}</h3><button class="theme" data-todoact="close">关闭</button></div>
      <div class="sb"><label class="f">在哪个目录开 Claude Code</label><input type="text" id="todo-root" value="${esc(t.root)}">
        <label class="f">发给 Claude Code 的话（可以先改）</label><textarea id="todo-text" rows="16">${esc(t.prompt)}</textarea>
        <div class="note">「在终端打开」会新开一个终端窗口，在这个目录运行 <code>claude "这段话"</code>，并把这个卡点标成「在做」。</div></div>
      <div class="sf"><span class="msg" id="todo-msg"></span><button class="btn" data-todoact="copy">复制</button>
        <button class="btn primary" data-todoact="launch">在终端打开</button></div>`;
  } catch (e) { dlg.querySelector(".sb").textContent = "读不到：" + e.message; }

async function todoAction(what) {
  const dlg = $("#todo");
  if (what === "close") return dlg.close();
  const text = dlg.querySelector("#todo-text").value, msg = dlg.querySelector("#todo-msg");
  if (what === "copy") { await navigator.clipboard.writeText(text); msg.textContent = "已复制"; return; }
  try {
    const {todo} = await api("/api/launch", {id: todoCur.rid, idx: todoCur.idx, root: dlg.querySelector("#todo-root").value, prompt: text});
    DATA.reportById[todoCur.rid].data.todo = todo;
    dlg.close(); toast("已在终端打开 Claude Code"); render();
  } catch (e) { msg.textContent = "失败：" + e.message; }
}

async function startDeep(gid, full, root) {
  try {
    const body = {task: gid, full: !!full};
    if (root !== undefined) body.root = root;
    const {id} = await api("/api/deep", body);
    state.deep[gid] = {id, status: "queued"};
    render(); pollDeep(gid);
  } catch (e) { toast("深挖没启动：" + e.message); }
}

async function pollDeep(gid) {
  const run = state.deep[gid];
  if (!run) return;
  try {
    const r = await api("/api/report?id=" + run.id);
    if (r.status === "done" || r.status === "error") {
      toast(r.status === "done" ? "深挖完成" : "深挖出错");
      localSet("radar.open", JSON.stringify(["t" + gid]));
      return location.reload();
    }
    if (r.status !== run.status) { run.status = r.status; render(); }
  } catch (e) { /* 服务重启之类，继续等 */ }
  setTimeout(() => pollDeep(gid), 3000);
}

  for (const t of DATA.tasks) for (const rid of t.reports) {
    const r = DATA.reportById[rid];
    if (r && (r.data || {}).kind === "deep" && !["done", "error"].includes(r.status) && Date.now() / 1000 - r.updated < 1800) {
      state.deep[t.id] = {id: r.id, status: r.status}; setTimeout(() => pollDeep(t.id), 1000);
    }
  }
}
try { for (const k of JSON.parse(localGet("radar.open") || "[]")) state.open.add(k); localSet("radar.open", "[]"); } catch {}

const savedTheme = localGet("radar.theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
renderStatus();
render();
</script>
</body>
